<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #1a1a1c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    overflow: hidden;
    position: relative;
  }
  .logo {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    color: #1a1a1c;
    z-index: 10;
    pointer-events: none;
  }
  .logo svg { width: 36px; height: 42px; fill: #7a2a38; }
  .model-wrap {
    width: 100%;
    max-width: 700px;
    height: 700px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
    --progress-bar-color: transparent;
    --progress-mask: transparent;
  }
  .mode-1 { animation: none; }
  @keyframes fadeScale {
    0% { opacity: 0; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1); }
  }
  .mode-2 { animation: fadeScale 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes inOut {
    0%   { opacity: 0; transform: translateY(60px) scale(0.85); }
    15%  { opacity: 1; transform: translateY(0) scale(1); }
    85%  { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.85); }
  }
  .mode-3 { animation: inOut 8s ease-in-out infinite; }
  @media (max-width: 700px) {
    .logo { font-size: 24px; top: 24px; }
    .logo svg { width: 28px; height: 32px; }
    .model-wrap { height: 500px; }
  }
</style>
