<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iSakha — Reels</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 30'%3E%3Cpath fill='%237a2a38' d='M17.05 15.6c-.03-3.2 2.6-4.73 2.72-4.8-1.48-2.17-3.79-2.47-4.6-2.5-1.96-.2-3.82 1.15-4.82 1.15-1 0-2.53-1.12-4.16-1.09-2.14.03-4.11 1.25-5.21 3.16-2.22 3.85-.57 9.55 1.6 12.68 1.06 1.53 2.32 3.25 3.97 3.19 1.6-.07 2.2-1.03 4.13-1.03 1.93 0 2.47 1.03 4.16.99 1.72-.03 2.8-1.56 3.85-3.1 1.21-1.78 1.71-3.5 1.74-3.59-.04-.02-3.34-1.28-3.38-5.06z'/%3E%3C/svg%3E">

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== КОНТЕЙНЕР 9:16 ===== */
  .reels {
    width: 1080px;
    height: 1920px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 9 / 16;
    background: #f5f5f7;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
  }

  /* Автомасштаб под окно */
  @media (max-aspect-ratio: 9/16) {
    .reels { width: 100vw; height: auto; }
  }
  @media (min-aspect-ratio: 9/16) {
    .reels { height: 100vh; width: auto; }
  }

  /* ===== ОБЩИЕ КЛАССЫ СЦЕН ===== */
  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }

  /* ===== ЦВЕТА И ШРИФТЫ ===== */
  :root {
    --bg: #f5f5f7;
    --text: #1a1a1c;
    --text-muted: #8a8a92;
    --accent: #7a2a38;
  }

  /* ===== СЦЕНА 1 — ЛОГОТИП ===== */
  .scene-1 {
    animation: scene1Cycle 18s infinite;
  }

  .logo-big {
    display: flex;
    align-items: center;
    gap: 40px;
    animation: logoAppear 18s infinite;
  }

  .logo-big svg {
    width: 200px;
    height: 240px;
    fill: var(--accent);
    animation: appleRotate 4s ease-in-out;
  }

  .logo-big .logo-text {
    font-size: 220px;
    font-weight: 700;
    letter-spacing: -10px;
    color: var(--text);
    line-height: 1;
  }

  @keyframes appleRotate {
    0% { transform: rotateY(0deg) scale(0.8); opacity: 0; }
    30% { transform: rotateY(180deg) scale(1); opacity: 1; }
    100% { transform: rotateY(360deg) scale(1); opacity: 1; }
  }

  @keyframes logoAppear {
    0% { opacity: 0; transform: translateY(40px); }
    5% { opacity: 1; transform: translateY(0); }
    15% { opacity: 1; transform: translateY(0); }
    18% { opacity: 0; transform: translateY(-40px); }
    100% { opacity: 0; transform: translateY(-40px); }
  }

  @keyframes scene1Cycle {
    0% { opacity: 1; }
    16% { opacity: 1; }
    18% { opacity: 0; }
    100% { opacity: 0; }
  }

  /* ===== СЦЕНА 2 — БОЛЬШАЯ МОДЕЛЬ ===== */
  .scene-2 {
    animation: scene2Cycle 18s infinite;
  }

  .model-big {
    width: 900px;
    height: 1400px;
    position: relative;
    animation: modelBigAppear 18s infinite;
  }

  .model-big model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
    --progress-bar-color: transparent;
    --progress-mask: transparent;
  }

  @keyframes modelBigAppear {
    0% { opacity: 0 ; transform: scale(0.7); }
    20% { opacity:  .1; transform: scale(1); }
    32model% { opacity: 1; transform: scale(0.5) translateY(-250px); }
    40% { opacity: 0; transform: scale(0.5) translateY(-250px); }
    100% { opacity: 0; }
  }

  @keyframes scene2Cycle {
    0% { opacity: 0; }
    18% { opacity: 1; }
    32% { opacity: 1; }
    36% { opacity: 0; }
    100% { opacity: 0; }
  }

  /* ===== СЦЕНА 3 — ТЕКСТ + МОДЕЛЬ В УГЛУ ===== */
  .scene-3 {
    animation: scene3Cycle 18s infinite;
  }

-corner {
    position: absolute;
    top: 200px;
    right: -100px;
    width: 700px;
    height: 900px;
  }

  .model-corner model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
  }

  .text-typing {
    position: absolute;
    bottom: 500px;
    left: 80px;
    right: 80px;
    text-align: left;
  }

  .text-typing .line {
    font-size: 96px;
    font-weight: 700;
    letter-spacing: -4px;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 20px;
    overflow: hidden;
    white-space: nowrap;
    width: 0;
  }

  .text-typing .line-1 {
    animation: typeLine1 18s steps(30) infinite;
  }

  .text-typing .line-2 {
    color: var(--accent);
    animation: typeLine2 18s steps(20) infinite;
  }

  @keyframes typeLine1 {
    0%, 33% { width: 0; }
    42% { width: 100%; }
    100% { width: 100%; }
  }

  @keyframes typeLine2 {
    0%, 40% { width: 0; }
    48% { width: 100%; }
    100% { width: 100%; }
  }

  @keyframes scene3Cycle {
    0% { opacity: 0; }
    33% { opacity: 1; }
    50% { opacity: 1; }
    54% { opacity: 0; }
    100% { opacity: 0; }
  }

  /* ===== СЦЕНА 4 — ЦЕНА + ПЕРЕКЛЮЧЕНИЕ ЦВЕТОВ ===== */
  .scene-4 {
    animation: scene4Cycle 18s infinite;
  }

  .model-switch {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 900px;
  }

  .model-switch model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
    position: absolute;
    inset: 0;
  }

  .mv-burgundy { animation: showBurgundy 18s infinite; }
  .mv-silver { animation: showSilver 18s infinite; }
  .mv-glacier { animation: showGlacier 18s infinite; }
  .mv-black { animation: showBlack 18s infinite; }

  @keyframes showBurgundy {
    0%, 54% { opacity: 1; }
    56%, 100% { opacity: 0; }
  }
  @keyframes showSilver {
    0%, 55% { opacity: 0; }
    56%, 62% { opacity: 1; }
    63%, 100% { opacity: 0; }
  }
  @keyframes showGlacier {
    0%, 62% { opacity: 0; }
    63%, 69% { opacity: 1; }
    70%, 100% { opacity: 0; }
  }
  @keyframes showBlack {
    0%, 69% { opacity: 0; }
    70%, 76% { opacity: 1; }
    78%, 100% { opacity: 0; }
  }

  .price-block {
    position: absolute;
    bottom: 400px;
    left: 0;
    right: 0;
    text-align: center;
  }

  .price-label {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0;
    animation: priceLabelShow 18s infinite;
  }

  .price-value {
    font-size: 140px;
    font-weight: 800;
    letter-spacing: -6px;
    color: var(--text);
    line-height: 1;
  }

  .price-value .currency {
    font-size: 90px;
    font-weight: 600;
    color: var(--accent);
    margin-left: 20px;
  }

  @keyframes priceLabelShow {
    0%, 55% { opacity: 0; }
    60%, 76% { opacity: 1; }
    78%, 100% { opacity: 0; }
  }

  @keyframes scene4Cycle {
    0% { opacity: 0; }
    54% { opacity: 1; }
    76% { opacity: 1; }
    80% { opacity: 0; }
    100% { opacity: 0; }
  }

  /* ===== СЦЕНА 5 — ФИНАЛ ===== */
  .scene-5 {
    animation: scene5Cycle 18s infinite;
  }

  .final-logo {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 60px;
    animation: finalFadeUp 18s infinite;
  }

  .final-logo svg {
    width: 100px;
    height: 120px;
    fill: var(--accent);
  }

  .final-logo .final-text {
    font-size: 110px;
    font-weight: 700;
    letter-spacing: -5px;
    color: var(--text);
    line-height: 1;
  }

  .final-model {
    width: 700px;
    height: 900px;
    margin-bottom: 60px;
    animation: finalModelIn 18s infinite;
  }

  .final-model model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
  }

  .final-tagline {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -1px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.3;
    margin-bottom: 30px;
    animation: finalFadeUp 18s infinite;
  }

  .final-tagline .accent {
    color: var(--accent);
    font-weight: 700;
  }

  .final-url {
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--text-muted);
    animation: finalFadeUp 18s infinite;
  }

  @keyframes finalFadeUp {
    0%, 79% { opacity: 0; transform: translateY(30px); }
    84% { opacity: 1; transform: translateY(0); }
    96% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(0); }
  }

  @keyframes finalModelIn {
    0%, 79% { opacity: 0; transform: scale(0.9); }
    84% { opacity: 1; transform: scale(1); }
    96% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }

  @keyframes scene5Cycle {
    0% { opacity: 0; }
    78% { opacity: 1; }
    97% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== ЗЕРНО / ШУМ (для премиума) ===== */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    z-index: 100;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>

  <div class="reels">

    <!-- СЦЕНА 1 — Логотип -->
    <div class="scene scene-1">
      <div class="logo-big">
        <svg viewBox="0 0 24 30">
          <path d="M17.05 15.6c-.03-3.2 2.6-4.73 2.72-4.8-1.48-2.17-3.79-2.47-4.6-2.5-1.96-.2-3.82 1.15-4.82 1.15-1 0-2.53-1.12-4.16-1.09-2.14.03-4.11 1.25-5.21 3.16-2.22 3.85-.57 9.55 1.6 12.68 1.06 1.53 2.32 3.25 3.97 3.19 1.6-.07 2.2-1.03 4.13-1.03 1.93 0 2.47 1.03 4.16.99 1.72-.03 2.8-1.56 3.85-3.1 1.21-1.78 1.71-3.5 1.74-3.59-.04-.02-3.34-1.28-3.38-5.06zM14.03 6.4c.88-1.07 1.47-2.55 1.31-4.03-1.27.05-2.8.84-3.71 1.91-.81.94-1.53 2.45-1.34 3.9 1.42.11 2.86-.72 3.74-1.78z"/>
        </svg>
        <div class="logo-text">iSakha</div>
      </div>
    </div>

    <!-- СЦЕНА 2 — Большая модель -->
    <div class="scene scene-2">
      <div class="model-big">
        <model-viewer
          src="iphone-18-pro-max-burgundy.glb"
          alt="iPhone 18 Pro Max"
          auto-rotate autoplay camera-controls touch-action="pan-y"
          shadow-intensity="1" exposure="1" interaction-prompt="none"
          rotation-per-second="40deg">
        </model-viewer>
      </div>
    </div>

    <!-- СЦЕНА 3 — Текст с печатной машинкой -->
    <div class="scene scene-3">
      <div class="model-corner">
        <model-viewer
          src="iphone-18-pro-max-burgundy.glb"
          alt="iPhone 18 Pro Max"
          auto-rotate autoplay camera-controls touch-action="pan-y"
          shadow-intensity="1" exposure="1" interaction-prompt="none"
          rotation-per-second="30deg">
        </model-viewer>
      </div>
      <div class="text-typing">
        <div class="line line-1">Оригинальные</div>
        <div class="line line-2">iPhone в Якутске</div>
      </div>
    </div>

    <!-- СЦЕНА 4 — Цена + переключение цветов -->
    <div class="scene scene-4">
      <div class="model-switch">
        <model-viewer class="mv-burgundy" src="iphone-18-pro-max-burgundy.glb" alt="Burgundy" auto-rotate autoplay touch-action="pan-y" shadow-intensity="1" interaction-prompt="none" rotation-per-second="40deg"></model-viewer>
        <model-viewer class="mv-silver" src="iphone-18-pro-max-silver.glb" alt="Silver" auto-rotate autoplay touch-action="pan-y" shadow-intensity="1" interaction-prompt="none" rotation-per-second="40deg"></model-viewer>
        <model-viewer class="mv-glacier" src="iphone-18-pro-max-glacier.glb" alt="Glacier" auto-rotate autoplay touch-action="pan-y" shadow-intensity="1" interaction-prompt="none" rotation-per-second="40deg"></model-viewer>
        <model-viewer class="mv-black" src="iphone-18-pro-max-black.glb" alt="Black" auto-rotate autoplay touch-action="pan-y" shadow-intensity="1" interaction-prompt="none" rotation-per-second="40deg"></model-viewer>
      </div>
      <div class="price-block">
        <div class="price-label">Цена</div>
        <div class="price-value" id="priceCounter">0 <span class="currency">₽</span></div>
      </div>
    </div>

    <!-- СЦЕНА 5 — Финал -->
    <div class="scene scene-5">
      <div class="final-logo">
        <svg viewBox="0 0 24 30">
          <path d="M17.05 15.6c-.03-3.2 2.6-4.73 2.72-4.8-1.48-2.17-3.79-2.47-4.6-2.5-1.96-.2-3.82 1.15-4.82 1.15-1 0-2.53-1.12-4.16-1.09-2.14.03-4.11 1.25-5.21 3.16-2.22 3.85-.57 9.55 1.6 12.68 1.06 1.53 2.32 3.25 3.97 3.19 1.6-.07 2.2-1.03 4.13-1.03 1.93 0 2.47 1.03 4.16.99 1.72-.03 2.8-1.56 3.85-3.1 1.21-1.78 1.71-3.5 1.74-3.59-.04-.02-3.34-1.28-3.38-5.06zM14.03 6.4c.88-1.07 1.47-2.55 1.31-4.03-1.27.05-2.8.84-3.71 1.91-.81.94-1.53 2.45-1.34 3.9 1.42.11 2.86-.72 3.74-1.78z"/>
        </svg>
        <div class="final-text">iSakha</div>
      </div>
      <div class="final-model">
        <model-viewer
          src="iphone-18-pro-max-black.glb"
          alt="iPhone 18 Pro Max"
          auto-rotate autoplay touch-action="pan-y"
          shadow-intensity="1" exposure="1" interaction-prompt="none"
          rotation-per-second="30deg">
        </model-viewer>
      </div>
      <div class="final-tagline">
        <span class="accent">Скоро открытие</span>
      </div>
      <div class="final-url">benger777.github.io/ISakha-1.1</div>
    </div>

    <!-- Зерно для премиума -->
    <div class="grain"></div>

  </div>

  <script>
    // ===== СЧЁТЧИК ЦЕНЫ =====
    const priceEl = document.getElementById('priceCounter');
    const targetPrice = 149990;
    let counterStarted = false;

    function startCounter() {
      if (counterStarted) return;
      counterStarted = true;

      const duration = 1500;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Плавное замедление в конце
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = Math.round(targetPrice * eased);

        priceEl.innerHTML = value.toLocaleString('ru-RU') + ' <span class="currency">₽</span>';

        if (progress < 1) {
          requestAnimationFrame(animate);
        }
      }

      requestAnimationFrame(animate);
    }

    // Запускаем счётчик когда сцена 4 появляется
    setTimeout(startCounter, 10200);

    // Перезапуск счётчика каждый цикл (каждые 18 сек)
    setInterval(() => {
      counterStarted = false;
      priceEl.innerHTML = '0 <span class="currency">₽</span>';
      setTimeout(startCounter, 200);
    }, 18000);
  </script>
</body>
</html>
